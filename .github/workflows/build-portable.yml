name: Build portable apps

# Reusable workflow: builds the Linux, Windows and macOS portable packages and
# smoke-tests them. Called by ci.yml (every push to master) and release.yml
# (version tags).
#
# Linux and Windows share the combined AlmaLinux 8 builder image (see
# docker/, Makefile) and run as a matrix on ubuntu-latest. macOS is a
# separate job (`build-macos`, below): there is no cross-compile path for
# macOS the way MinGW covers Windows, so it runs natively on a macos-14
# runner instead, entirely outside the Docker/Podman machinery.
#
# The Linux/Windows platforms run as separate matrix jobs. That is not just
# concurrency: each job gets its own runner, so the two builds no longer
# share one runner's four cores. Both jobs pull the SAME image -- a
# Windows-only image could not be meaningfully smaller, because the
# cross-build needs the Linux Qt as QT_HOST_PATH (winbuild/build.sh) on top
# of MinGW, Wine and the Windows Qt.
#
# Every job uploads its own artifact ("portable-linux" / "portable-windows" /
# "portable-macos"), with dist/ as the artifact root so the platform
# subdirectory is preserved. The publishing jobs merge them back with
# `pattern: portable-*` + `merge-multiple: true`, which restores the layout
# their release globs expect.
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The names do not follow a common pattern (linuxbuild/ vs winbuild/),
          # so every job carries its own explicitly.
          - platform: linux
            scripts: linuxbuild
            # System libraries the portable package deliberately does NOT
            # bundle (see the is_bundlable rule in linuxbuild/deploy.sh), but
            # which a bare ubuntu-latest runner lacks, unlike a real desktop:
            #   - the Mesa/GLVND set: the runner has no GL stack at all
            #   - libpulse0: pulled in by libQt6Multimedia, so it is needed at
            #     startup. It used to arrive by accident as a dependency of
            #     wine, back when one job built both platforms.
            apt: xvfb libopengl0 libglx-mesa0 libgl1 libegl1 libgles2 libglvnd0 libpulse0
          - platform: windows
            scripts: winbuild
            apt: xvfb wine
    name: build (${{ matrix.platform }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: git describe needs both

      - name: Install smoke-test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ${{ matrix.apt }}

      # The builder image (~7 GB: Qt 6.8.3 for both platforms + MinGW
      # cross-compiler + Wine + FFmpeg headers) is cached in GHCR, keyed by a
      # hash of the files that define its content. Rebuilt only when one of
      # those actually changes.
      #
      # This key is only complete because the image contains NOTHING from
      # outside docker/ -- the build and deploy scripts are read from the
      # bind-mounted checkout at build time (see docker/Dockerfile). Never
      # COPY a file from elsewhere into the image without adding it here, or
      # edits to it will silently hit the cache and be ignored.
      - name: Compute builder image cache key
        id: key
        run: |
          key=$(cat docker/Dockerfile docker/deps.env docker/deps.sh docker/importlibs.sh | sha256sum | cut -c1-12)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Derived from github.repository (owner/repo), not hardcoded to the
      # blitzview-org GitHub App installation -- so this workflow also works
      # unmodified in a fork or a private test repo under a different owner.
      # GHCR image paths must be all-lowercase; github.repository preserves
      # the account's display casing, so it is lowercased here.
      - name: Compute builder image repository
        id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-build" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull or build the builder image
        env:
          IMG: ${{ steps.image.outputs.repo }}:${{ steps.key.outputs.key }}
          LATEST: ${{ steps.image.outputs.repo }}:latest
        run: |
          if docker pull "$IMG"; then
            docker tag "$IMG" blitzview-build
          else
            echo "no cached image for this key, building from scratch"
            make build-image-force PODMAN=docker BUILD_IMAGE=blitzview-build
            docker tag blitzview-build "$IMG"
            docker push "$IMG"
            docker tag blitzview-build "$LATEST"
            docker push "$LATEST"
          fi

      - name: Build portable package
        run: make ${{ matrix.platform }}-portable PODMAN=docker BUILD_IMAGE=blitzview-build

      - name: Smoke test
        run: ${{ matrix.scripts }}/smoke-test.sh build/${{ matrix.platform }}/BlitzView

      # path: dist (not dist/<platform>/*) keeps the platform directory inside
      # the artifact, which is what the merged download in ci.yml and
      # release.yml globs against.
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: dist
          retention-days: 14

  # Native macOS build -- no builder image, no Docker/Podman. See macbuild/
  # for the scripts this drives.
  build-macos:
    runs-on: macos-14
    name: build (macos)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: git describe needs both

      - name: Read pinned Qt version
        id: qt
        run: |
          . docker/deps.env
          echo "version=$QT_VERSION" >> "$GITHUB_OUTPUT"

      # aqtinstall's mac desktop kit is already a universal2 (x86_64 + arm64)
      # binary distribution, so one Qt download covers both target CPUs --
      # see macbuild/build.sh for the CMAKE_OSX_ARCHITECTURES build.
      - name: Cache Qt (aqtinstall)
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: qt
          key: qt-macos-${{ steps.qt.outputs.version }}-${{ hashFiles('docker/deps.env') }}

      # macos-14's system Python is externally managed (PEP 668) -- a plain
      # `pip install` is blocked. pipx (preinstalled on GitHub's macOS
      # runners) installs aqtinstall into its own venv and puts `aqt` on
      # PATH, sidestepping that restriction without needing --break-system-packages.
      - name: Install Qt (aqtinstall)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pipx install aqtinstall==3.3.0
          aqt install-qt mac desktop "${{ steps.qt.outputs.version }}" clang_64 \
              -m qtmultimedia qtimageformats -O qt

      - name: Cache FFmpeg headers
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/macos/ffmpeg-include
          key: ffmpeg-headers-macos-${{ hashFiles('docker/deps.env') }}

      - name: Fetch FFmpeg headers
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: macbuild/fetch-ffmpeg-headers.sh build/macos/ffmpeg-include

      - name: Build portable package
        env:
          QT_MACOS_PREFIX: ${{ github.workspace }}/qt/${{ steps.qt.outputs.version }}/macos
          FFMPEG_INCLUDE_DIR: ${{ github.workspace }}/build/macos/ffmpeg-include
        run: make macos-portable

      - name: Smoke test
        run: macbuild/smoke-test.sh build/macos/BlitzView

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: portable-macos
          path: dist
          retention-days: 14
